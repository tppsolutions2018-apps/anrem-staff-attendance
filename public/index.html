var CAC_API_BASE=window.CAC_API_BASE||window.location.origin;

function cloudPush(k,v,applyState){if(!cloudToken()||!CAC_API_BASE)return Promise.resolve(false);var endpoint=k==='rcs_att'?CAC_API_BASE+'/api/attendance/sync':CAC_API_BASE+'/api/snapshot/'+encodeURIComponent(k);return fetch(endpoint,{method:'POST',headers:cloudHeaders(),body:JSON.stringify({value:v})}).then(function(r){if(r.status===401){try{localStorage.removeItem('anrem_cloud_token')}catch(e){};throw new Error('Session expired. Please log in again.')}if(!r.ok)throw new Error('Cloud save failed ('+r.status+')');return r.json()}).then(function(x){if(applyState!==false&&x.state)applyCloudState(x.state);return true}).catch(function(e){console.warn('Cloud sync failed',e);toast(e.message||'Cloud save failed. Please check your internet connection.');return false})}

function users(){

 // it actually changes the local account list, avoiding repeated cloud writes

 ps.forEach(function(person){
  if(!person || String(person.role||'').toLowerCase()!=='staff' || !person.uid)return;
  var uid=String(person.uid).trim();
  var savedUsername=String(person.loginUsername||person.staffUsername||'').trim().toLowerCase();
  var savedPassword=person.loginPassword!=null?String(person.loginPassword):'';
  var existing=a.find(function(u){
   return String(u.uid||'').toLowerCase()===uid.toLowerCase() ||
          (savedUsername && String(u.username||'').toLowerCase()===savedUsername) ||
          String(u.username||'').toLowerCase()===uid.toLowerCase();
  });

   existing={name:person.name,username:savedUsername||uid,password:savedPassword,role:'Staff',staffOnly:true,uid:uid,active:person.paused?false:true};
   a.push(existing);changed=true;
  }else{
   var before=JSON.stringify(existing);
   existing.uid=uid; existing.name=person.name; existing.role='Staff'; existing.staffOnly=true;
   if(existing.password===undefined)existing.password='';
   if(savedUsername){existing.username=savedUsername;}
   if(savedPassword){existing.password=savedPassword;}
   if(existing.active===undefined)existing.active=!person.paused;
   if(before!==JSON.stringify(existing))changed=true;
  }
 });
 // Normalize any legacy staff account that is linked to a registered Staff record.
 a.forEach(function(u){
  if(!u)return;
  var before=JSON.stringify(u);
  var match=ps.find(function(person){return person&&String(person.role||'').toLowerCase()==='staff'&&(String(person.uid||'').toLowerCase()===String(u.uid||'').toLowerCase()||String(person.uid||'').toLowerCase()===String(u.username||'').toLowerCase())});

  if(before!==JSON.stringify(u))changed=true;

}
function people(){return storeGet('rcs_people',[])}function savePeople(a){return storeSet('rcs_people',a)}function att(){return storeGet('rcs_att',[])}function saveAtt(a){return storeSet('rcs_att',a)}
function normRole(r){r=String(r||'').trim().toLowerCase();return r==='staff'||r==='teacher'?'Staff':r==='student'?'Student':r==='admin'?'Admin':r}
function normSession(s){s=String(s||'').trim().toLowerCase();if(s==='clock in'||s==='work start'||s==='start'||s==='in')return 'Clock In';if(s==='clock out'||s==='work finish'||s==='finish'||s==='out')return 'Clock Out';return String(s||'')}

function eventId(r){if(!r._eventId){ensureAttendanceIds();}return r&&r._eventId} 
ensureAttendanceIds();function greports(){return storeGet('rcs_greports',[])}function saveGreports(a){return storeSet('rcs_greports',a)}

function isRegisteredStaff(u){
 if(!u)return false;
 var uid=String(u.uid||'').trim().toLowerCase();
 var username=String(u.username||'').trim().toLowerCase();
 return people().some(function(p){
  return p&&String(p.role||'').toLowerCase()==='staff'&&(String(p.uid||'').trim().toLowerCase()===uid || String(p.uid||'').trim().toLowerCase()===username);
 });
}
async function login(){
  var u=String($('loginUser').value||'').trim().toLowerCase();
  var p=String($('loginPass').value||'').trim();
  var cloud=await cloudLogin(u,p);
  if(cloud===false)return false;
  var found=cloud?cloud.user:null;
  if(!found && !CLOUD_REQUIRED)found=users().find(function(x){return String(x.username||'').trim().toLowerCase()===u&&String(x.password||'')===p});
  if(!found){var staffFallback=people().find(function(st){return st&&String(st.role||'').toLowerCase()==='staff'&&String(st.loginUsername||st.staffUsername||'').trim().toLowerCase()===u&&String(st.loginPassword||st.staffPassword||'')===p;});if(staffFallback)found={name:staffFallback.name,username:u,password:p,role:'Staff',staffOnly:true,uid:staffFallback.uid,active:staffFallback.paused?false:true};}
  
  if(!found){toast('Invalid username or password.');return false}
  if(found.active===false){toast('This user account is paused. Contact Admin.');return false;}
  if(String(found.role||'').toLowerCase()==='staff'){
   if(!isRegisteredStaff(found)){toast('Only a registered staff can log in. Ask Admin to register the staff first.');return false;}
   var staff=people().find(function(x){return x&&String(x.role||'').toLowerCase()==='staff'&&(String(x.uid||'').toLowerCase()===String(found.uid||'').toLowerCase()||String(x.uid||'').toLowerCase()===String(found.username||'').toLowerCase())});
   if(staff&&staff.paused){toast('This staff account is paused. Contact Admin.');return false;}
  }
  currentUser=found;cacheSet('anrem_current_user',found);$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=found.name+' ('+found.role+')';makeTabs();nav(found.role==='Staff'?'clock':'dash');return false;
 }

var pages=[['dash','Dashboard'],['staff','Create Staff ID Card'],['scanStaff','Scan Staff'],['staffRecords','Staff Records'],['clock','Staff Clock In/Out'],['reports','Reports'],['settings','Settings']];

function count(role,session){var s={};att().filter(function(r){return r.date===today()&&r.role===role&&(!session||r.session===session)}).forEach(function(r){s[r.uid]=1});return Object.keys(s).length}
function dash(m){var ps=people(),ft=ps.filter(function(p){return p.role==='Staff'}).length;m.innerHTML='<div class="grid"><div class="card stat"><p>Staff Present</p><h2>'+count('Staff')+'</h2></div><div class="card stat"><p>Staff Absent</p><h2>'+Math.max(0,ft-count('Staff'))+'</h2></div></div><br><div class="card"><h2>Today Staff Attendance Summary</h2><div class="grid"><div class="card"><b>Work Start</b><p>Staff: '+count('Staff','Work Start')+'</p></div><div class="card"><b>Work Finish</b><p>Staff: '+count('Staff','Work Finish')+'</p></div></div></div><br><div class="card"><h2>Staff Module</h2><div class="row"><button data-go="staff">Register / Edit Staff</button><button class="green" data-go="scanStaff">Scan Staff Attendance</button><button class="light" data-go="staffRecords">Staff Records</button></div></div><br><div class="card"><h2>Reports</h2><button class="red" data-go="reports">Open Reports</button></div>';bindGo(m)}

function peopleTable(role,list){
 if(role!=='Student'){
  var h='<div class="card"><h2>'+role+' List</h2><div class="tablewrap"><table><tr><th>Name</th><th>ID</th><th>Assignment</th><th>Total Present</th><th>Total Absent</th><th>Action</th></tr>';

 var out='';Object.keys(groups).sort().forEach(function(cls){out+='<div class="card"><h3>'+esc(cls)+' — Students ('+groups[cls].length+')</h3><div class="tablewrap"><table><tr><th>Name</th><th>ID</th><th>Total Present</th><th>Total Absent</th><th>Action</th></tr>';groups[cls].forEach(function(p){var z=attendanceSummary(p);out+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.uid)+'</td><td>'+z.present+'</td><td>'+z.absent+'</td><td><button data-edit="'+p.uid+'">Edit</button> <button class="orange" data-id="'+p.uid+'">View ID</button> <button class="red" data-del="'+p.uid+'">Delete</button></td></tr>'});out+='</table></div></div>'});

function attendanceDays(role){var ds={};att().filter(function(r){return r.role===role}).forEach(function(r){ds[r.date]=1});return Object.keys(ds)}
function parseClockMinutes(dateStr,timeStr){var d=new Date(String(dateStr||'')+' '+String(timeStr||''));if(!isNaN(d.getTime()))return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;var m=String(timeStr||'').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);if(!m)return null;var h=Number(m[1]),mi=Number(m[2]),se=Number(m[3]||0);if(m[4]){var ap=m[4].toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;}return h*60+mi+se/60}

t().reverse().forEach(function(k){h+='<tr><td>'+esc(k)+'</td><td><b>'+formatDuration(q.weekly[k])+'</b></td></tr>'});if(!Object.keys(q.weekly).length)h+='<tr><td colspan="2">No completed clock-in/out pairs yet.</td></tr>';h+='</table></div><h4>Monthly Totals</h4><div class="tablewrap"><table><tr><th>Month</th><th>Total Hours & Minutes</th></tr>';Object.keys(q.monthly).sort().reverse().forEach(function(k){h+='<tr><td>'+esc(k)+'</td><td><b>'+formatDuration(q.monthly[k])+'</b></td></tr>'});if(!Object.keys(q.monthly).length)h+='<tr><td colspan="2">No completed clock-in/out pairs yet.</td></tr>';h+='</table></div></div>';return h}

 var staffUsername=$('pUsername')?$('pUsername').value.trim().toLowerCase():'';

  try{
   var arr=people();if(!Array.isArray(arr))arr=[];
   if(role==='Staff'){
    var preUsers=users();
    var preDup=preUsers.find(function(u){return String(u.username||'').trim().toLowerCase()===staffUsername && (!old || u.uid!==old.uid);});
    if(preDup){toast('Staff username already exists. Choose another username.');if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}
   }
   var created=null;
   if(old){
    var i=arr.findIndex(function(p){return p.uid===old.uid});
    if(i<0){toast('Staff record was not found. Please register again.');if(btn){btn.disabled=false;btn.textContent='Save Edit';}return;}
    arr[i]={uid:old.uid,role:role,name:name,classDept:cls,tel:tel,addr:addr,photo:photo||old.photo||'',loginUsername:staffUsername||old.loginUsername||old.staffUsername||'',loginPassword:staffPassword||old.loginPassword||old.staffPassword||''};
    created=arr[i];
   }else{
    var uid=nextId(role),n=1;
    while(arr.some(function(p){return p.uid===uid})){uid=nextId(role)+'-'+(n++);}
    created={uid:uid,role:role,name:name,classDept:cls,tel:tel,addr:addr,photo:photo||'',loginUsername:staffUsername,loginPassword:staffPassword};
    arr.push(created);
   }
   var saved=savePeople(arr);

   }
   if(!saved){if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}
   var check=people().find(function(p){return p.uid===created.uid});
   if(!check){toast('Unable to verify saved staff record.');if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}

    var latestPeople=people(), pi=latestPeople.findIndex(function(x){return x.uid===created.uid});

     latestPeople[pi].loginUsername=staffUsername;
     if(staffPassword)latestPeople[pi].loginPassword=staffPassword;
     savePeople(latestPeople);
     created=latestPeople[pi];
    }
    var ua=users();
    var duplicate=ua.find(function(u){return String(u.username||'').trim().toLowerCase()===staffUsername && (!old || u.uid!==created.uid);});
    if(duplicate){toast('Staff username already exists. Choose another username.');if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}
    var linked=ua.find(function(u){return u.uid===created.uid;});

    if(linked){linked.uid=created.uid;linked.name=created.name;linked.username=staffUsername;linked.role='Staff';linked.staffOnly=true;linked.active=created.paused?false:(linked.active===false?false:true);if(staffPassword)linked.password=staffPassword;}
    else {ua.push({name:created.name,username:staffUsername,password:staffPassword,role:'Staff',staffOnly:true,uid:created.uid,active:created.paused?false:true});}
    if(!storeSet('rcs_users',ua)){toast('Staff profile saved, but login account could not be saved locally.');if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}
    var usersCloudOk=await cloudPush('rcs_users',users());
    if(!usersCloudOk){toast('Staff profile was saved, but the login account was not confirmed in the cloud. Please retry.');if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}
   }else{
    var otherCloudOk=await cloudPush('rcs_people',people());
    if(!otherCloudOk){toast('Profile was saved on this device, but cloud save failed. Please retry.');if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}return;}
   }

   if(!old){
    // Re-render a fresh form so all fields—including username/password—are cleared.
    profilePage($('main'),role);

    return;
   }
   toast('Staff updated successfully. Login: '+staffUsername);
   showId(created.uid);
  }catch(e){console.error(e);toast('Save error: '+e.message);if(btn){btn.disabled=false;btn.textContent=old?'Save Edit':'Save and Create ID';}}
 });
}

function syncRegisteredStaffLogins(){
 var ps=people(), ua=users(), changed=false;
 ps.forEach(function(p){
  if(!p||String(p.role||'').toLowerCase()!=='staff'||!p.uid)return;
  var username=String(p.loginUsername||p.staffUsername||'').trim().toLowerCase();
  var password=p.loginPassword!=null?String(p.loginPassword):'';
  var u=ua.find(function(x){return x&&x.uid===p.uid&&String(x.role||'').toLowerCase()==='staff';});
  if(!u && username)u=ua.find(function(x){return String(x.username||'').toLowerCase()===username;});
  if(!u && username){u={name:p.name,username:username,password:password,role:'Staff',staffOnly:true,uid:p.uid,active:p.paused?false:true};ua.push(u);changed=true;}
  if(u){
   if(u.name!==p.name){u.name=p.name;changed=true;}
   if(username&&u.username!==username){u.username=username;changed=true;}
   if(password&&u.password!==password){u.password=password;changed=true;}
   if(u.uid!==p.uid){u.uid=p.uid;changed=true;}
   if(u.role!=='Staff'){u.role='Staff';changed=true;}
   if(u.staffOnly!==true){u.staffOnly=true;changed=true;}
   if(u.active===undefined){u.active=!p.paused;changed=true;}
   if(p.paused && u.active!==false){u.active=false;changed=true;}
  }
 });
 if(changed)storeSet('rcs_users',ua);
 return ua;
}
function repairStaffLogins(){

  if(!p||String(p.role||'').toLowerCase()!=='staff'||!p.uid)return;
  var username=String(p.loginUsername||p.staffUsername||'').trim().toLowerCase();
  var password=p.loginPassword!=null?String(p.loginPassword):'';
  if(!username)return;
  var u=ua.find(function(x){return x&&x.uid===p.uid&&String(x.role||'').toLowerCase()==='staff';})||ua.find(function(x){return x&&String(x.username||'').toLowerCase()===username;});
  if(!u){u={name:p.name,username:username,password:password,role:'Staff',staffOnly:true,uid:p.uid,active:p.paused?false:true};ua.push(u);created++;}
  else{u.name=p.name;u.username=username;u.uid=p.uid;u.role='Staff';u.staffOnly=true;if(password)u.password=password;u.active=p.paused?false:(u.active===false?false:true);updated++;}
 });
 storeSet('rcs_users',ua);
 settings($('main'));
 toast('Staff logins repaired. Created: '+created+' | Updated: '+updated);
}

 };

async function restoreSession(){

async function deleteStaff(uid){
var p=people().find(function(x){return x.uid===uid});
if(!p)return toast('Staff record not found');

if(!confirm('Delete '+(p.name||'this staff')+'? This removes the Staff record and login account.'))return;

try{
var r=await fetch(CAC_API_BASE+'/api/staff/'+encodeURIComponent(uid),{
method:'DELETE',
headers:cloudHeaders()
});

var x=await r.json().catch(function(){return {}});

if(r.status===401){
try{localStorage.removeItem('anrem_cloud_token')}catch(e){}
return toast('Session expired. Please log in again.');
}

if(!r.ok)throw new Error(x.error||'Unable to delete Staff');

if(x.state)applyCloudState(x.state);

adminStaffPage($('main'));

toast('Staff record deleted; attendance history preserved.');

}catch(e){
