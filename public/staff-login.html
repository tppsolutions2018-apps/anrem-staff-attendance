<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Staff Login Portal - ANREM</title>
<style>:root{--navy:#241075;--orange:#f58220;--red:#e51b23;--green:#0a9652;--bg:#f4f6fb;--line:#e5e7ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#111}button{border:0;border-radius:14px;padding:13px 16px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;cursor:pointer}button.green{background:var(--green)}button.red{background:var(--red)}button.light{background:#fff;color:var(--navy);border:1px solid var(--line)}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 25px #00000010}.login-card{max-width:460px;width:100%}.logo{width:110px;height:110px;object-fit:contain;border-radius:24px;display:block;margin:0 auto 10px}h1,h2{color:var(--navy);text-align:center}label{font-size:13px;color:#475467;font-weight:800}.pass{display:grid;grid-template-columns:1fr 70px;gap:8px}.hide{display:none!important}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px;z-index:5}.top img{width:48px;height:48px;object-fit:contain}.spacer{flex:1}.wrap{max-width:850px;margin:auto;padding:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1;min-width:150px}.stat{font-size:30px;font-weight:900;color:var(--navy);text-align:center;padding:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#fafafa;color:var(--navy)}#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:999px;display:none;z-index:99;max-width:92%;text-align:center}.note{background:#fff8e8;border:1px solid #f3d48a;padding:12px;border-radius:14px;color:#6b4e00}@media(max-width:600px){.row{display:grid}.row button{width:100%}}
.login-role{font-size:22px;font-weight:900;letter-spacing:.4px;text-align:center;margin:14px 0 4px}.login-subtitle{text-align:center;color:#667085;font-size:14px;font-weight:600;margin:0 0 18px}.admin-role{padding:10px 12px;border-radius:12px;background:#eee8ff;color:#241075;border:1px solid #d8ccff}.staff-role{padding:10px 12px;border-radius:12px;background:#fff1e7;color:#b84f00;border:1px solid #ffd2ad}
</style></head><body>
<div id="login" class="center"><form id="loginForm" class="card login-card"><img class="logo" src="logo.png"><div class="login-role staff-role">👤 STAFF LOGIN</div><p class="login-subtitle">Staff Attendance &amp; Clock In/Out</p><p style="text-align:center;color:#667085">ANREM Staff Attendance</p><label>Staff ID or Username</label><input id="staffUser" autocomplete="username" placeholder="e.g. ANREM-STF-123456 or username"><br><br><label>Password</label><div class="pass"><input id="staffPass" type="password" autocomplete="current-password" placeholder="Enter your password"><button type="button" class="light" id="eye">👁</button></div><br><button type="submit" style="width:100%">Login as Staff</button><br><br><a href="index.html" style="display:block;text-align:center;color:#241075;font-weight:800;text-decoration:none">Admin Login</a><p class="note">Use the Staff ID shown on your Staff ID card, or the username created during Staff registration.</p></form></div>
<div id="app" class="hide"><div class="top"><img src="logo.png"><b id="who">Staff</b><span class="spacer"></span><button class="light" id="logout">Logout</button></div><div class="wrap"><div id="content"></div></div></div><div id="toast"></div>
<script>
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.style.display='none'},2800)}
var CAC_API_BASE=window.CAC_API_BASE||window.location.origin;
function cloudToken(){try{return localStorage.getItem('anrem_cloud_token')||''}catch(e){return ''}}
function cloudHeaders(){var h={'Content-Type':'application/json'};var t=cloudToken();if(t)h.Authorization='Bearer '+t;return h}
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function applyCloudState(st){if(!st)return;Object.keys(st).forEach(function(k){cacheSet(k,st[k])})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function people(){var a=get('rcs_people',[]);return Array.isArray(a)?a:[]}
function users(){var a=get('rcs_users',[]);return Array.isArray(a)?a:[]}
function att(){var a=get('rcs_att',[]);return Array.isArray(a)?a:[]}
function today(){return new Date().toISOString().slice(0,10)}
function timeNow(){return new Date().toLocaleTimeString()}
async function cloudLogin(identifier,password){
 try{
  var r=await fetch(CAC_API_BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:String(identifier||'').trim().toLowerCase(),password:String(password||'')})});
  var x=await r.json().catch(function(){return {error:'Login failed'}});
  if(!r.ok)throw new Error(x.error||'Login failed');
  if(!x.user||String(x.user.role||'').toLowerCase()!=='staff')throw new Error('Please use the Staff Login Portal with a registered Staff account.');
  localStorage.setItem('anrem_cloud_token',x.token);
  applyCloudState(x.state);
  return x;
 }catch(e){
  toast(e.message||'Cloud login failed');
  return false;
 }
}
async function restore(){
 var token=cloudToken();
 if(!token)return;
 try{
  var r=await fetch(CAC_API_BASE+'/api/state',{headers:cloudHeaders()});
  if(!r.ok)throw new Error('Session expired');
  var st=await r.json();
  applyCloudState(st);
  var uid=String((st.rcs_people||[]).find(function(x){return x&&String(x.role||'').toLowerCase()==='staff'})?.uid||'');
  var u=(st.rcs_users||[]).find(function(x){return x&&String(x.role||'').toLowerCase()==='staff'});
  if(u&&u.uid)uid=String(u.uid);
  var s=(st.rcs_people||[]).find(function(x){return x&&String(x.role||'').toLowerCase()==='staff'&&String(x.uid||'')===uid});
  if(s&&!s.paused){
   current=s;
   sessionStorage.setItem('cac_staff_portal_uid',s.uid);
   $('login').classList.add('hide');$('app').classList.remove('hide');
   $('who').textContent=s.name+' • '+s.uid;
   render();
  }
 }catch(e){
  try{localStorage.removeItem('anrem_cloud_token')}catch(x){}
  sessionStorage.removeItem('cac_staff_portal_uid');
 }
}
async function login(e){
 if(e)e.preventDefault();
 var btn=$('loginForm').querySelector('button[type="submit"]');
 if(btn)btn.disabled=true;
 try{
  var identifier=$('staffUser').value.trim();
  var password=$('staffPass').value;
  if(!identifier||!password){toast('Enter your Staff ID/username and password.');return false}
  var cloud=await cloudLogin(identifier,password);
  if(cloud===false)return false;
  var staff=cloud.user;
  if(!staff||String(staff.role||'').toLowerCase()!=='staff'){toast('This is not a Staff account.');return false}
  if(staff.active===false){toast('Your Staff account is paused. Contact Admin.');return false}
  var ps=people();
  var profile=ps.find(function(x){return x&&String(x.role||'').toLowerCase()==='staff'&&String(x.uid||'').toLowerCase()===String(staff.uid||'').toLowerCase()});
  if(!profile){toast('Registered Staff record not found. Contact Admin.');return false}
  if(profile.paused){toast('Your Staff account is paused. Contact Admin.');return false}
  current=Object.assign({},profile,{username:staff.username,role:'Staff'});
  sessionStorage.setItem('cac_staff_portal_uid',current.uid);
  $('login').classList.add('hide');$('app').classList.remove('hide');
  $('who').textContent=current.name+' • '+current.uid;
  $('staffPass').value='';
  render();
  return false;
 }finally{
  if(btn)btn.disabled=false;
 }
}
function logout(){current=null;sessionStorage.removeItem('cac_staff_portal_uid');try{localStorage.removeItem('anrem_cloud_token')}catch(e){}$('app').classList.add('hide');$('login').classList.remove('hide');$('staffPass').value=''}

function parseClockMinutes(dateStr,timeStr){var d=new Date(String(dateStr||'')+' '+String(timeStr||''));if(!isNaN(d.getTime()))return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;var m=String(timeStr||'').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);if(!m)return null;var h=Number(m[1]),mi=Number(m[2]),se=Number(m[3]||0);if(m[4]){var ap=m[4].toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;}return h*60+mi+se/60}
function formatDuration(mins){if(mins===null||mins===undefined||isNaN(mins))return '—';mins=Math.max(0,Math.round(mins));return Math.floor(mins/60)+'h '+String(mins%60).padStart(2,'0')+'m'}
function dailyRows(){var a=att().filter(function(r){return r.uid===current.uid&&(r.session==='Clock In'||r.session==='Clock Out')}),days={};a.forEach(function(r){(days[r.date]||(days[r.date]=[])).push(r)});var out=[];Object.keys(days).sort().forEach(function(date){var events=days[date].slice().sort(function(a,b){return parseClockMinutes(date,a.time)-parseClockMinutes(date,b.time)}),pairs=[],open=null,total=0;events.forEach(function(r){if(r.session==='Clock In'){if(open===null)open=r;}else if(r.session==='Clock Out'&&open){var im=parseClockMinutes(date,open.time),om=parseClockMinutes(date,r.time),mins=om-im;if(mins<0)mins+=1440;total+=mins;pairs.push({in:open,out:r,minutes:mins});open=null;}});out.push({date:date,events:events,pairs:pairs,open:open,totalMinutes:total});});return out}
function periodKey(date,period){var d=new Date(date+'T00:00:00');if(period==='month')return date.slice(0,7);var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function render(){if(!current)return;var a=att(),day=a.filter(function(r){return r.uid===current.uid&&r.date===today()}),last=day.length?day[day.length-1]:null,history=a.filter(function(r){return r.uid===current.uid&&(r.session==='Clock In'||r.session==='Clock Out')}).slice(-40).reverse(),rows=dailyRows(),weekly={},monthly={};rows.forEach(function(r){if(r.totalMinutes>0){var w=periodKey(r.date,'week'),mo=periodKey(r.date,'month');weekly[w]=(weekly[w]||0)+r.totalMinutes;monthly[mo]=(monthly[mo]||0)+r.totalMinutes;}});var now=new Date(),weekStart=new Date(now);weekStart.setDate(now.getDate()-((now.getDay()+6)%7));var ws=weekStart.toISOString().slice(0,10),month=today().slice(0,7),daily=rows.reduce(function(n,r){return n+(r.totalMinutes||0)},0);var report='<br><div class="card"><h3>My Hours Report</h3><div class="row"><div class="card"><b>All Recorded</b><h2>'+formatDuration(daily)+'</h2></div><div class="card"><b>This Week</b><h2>'+formatDuration(weekly[ws]||0)+'</h2></div><div class="card"><b>This Month</b><h2>'+formatDuration(monthly[month]||0)+'</h2></div></div><div class="tablewrap"><table><tr><th>Date</th><th>Clock In → Clock Out</th><th>Open Clock In</th><th>Hours & Minutes</th></tr>'+rows.slice().reverse().map(function(r){return '<tr><td>'+esc(r.date)+'</td><td>'+(r.pairs.length?r.pairs.map(function(x){return esc(x.in.time)+' → '+esc(x.out.time)+' ('+formatDuration(x.minutes)+')'}).join('<br>'):'—')+'</td><td>'+(r.open?esc(r.open.time):'—')+'</td><td><b>'+formatDuration(r.totalMinutes)+'</b></td></tr>'}).join('')+'</table></div></div><br><div class="card"><h3>Weekly & Monthly Totals</h3><p><b>Week '+esc(ws)+':</b> '+formatDuration(weekly[ws]||0)+' &nbsp; <b>Month '+esc(month)+':</b> '+formatDuration(monthly[month]||0)+'</p></div>';$('content').innerHTML='<div class="card"><h2>Welcome, '+esc(current.name)+'</h2><p style="text-align:center"><b>Staff ID:</b> '+esc(current.uid)+'</p><div class="stat">'+esc(timeNow())+'</div><div class="row"><button class="green" id="inBtn">Clock In</button><button class="red" id="outBtn" '+((!last||last.session!=='Clock In')?'disabled':'')+'>Clock Out</button></div><br><p style="text-align:center;color:#667085">'+(last&&last.session==='Clock In'?'Currently clocked in since '+esc(last.time):'Ready to clock in. You may clock in and out multiple times each day.')+'</p></div><br><div class="card"><h3>My Recent Attendance</h3><div class="tablewrap"><table><tr><th>Date</th><th>Time</th><th>Action</th></tr>'+history.map(function(r){return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.time)+'</td><td>'+esc(r.session)+'</td></tr>'}).join('')+'</table></div></div>'+report;$('inBtn').onclick=function(){clock('Clock In')};$('outBtn').onclick=function(){clock('Clock Out')}}
async function clock(action){
 var a=att(),day=a.filter(function(r){return r.uid===current.uid&&r.date===today()}),last=day.length?day[day.length-1]:null;
 if(action==='Clock In'&&last&&last.session==='Clock In')return toast('You are already clocked in. Clock Out before another Clock In.');
 if(action==='Clock Out'&&(!last||last.session!=='Clock In'))return toast('Please Clock In first.');
 var event={_eventId:'evt-'+Date.now()+'-'+Math.random().toString(36).slice(2),date:today(),time:timeNow(),uid:current.uid,name:current.name,role:'Staff',classDept:current.classDept||'',session:action,status:'Present',scanner:'Staff Portal'};
 try{
  var r=await fetch(CAC_API_BASE+'/api/attendance/sync',{method:'POST',headers:cloudHeaders(),body:JSON.stringify({value:[event]})});
  var x=await r.json().catch(function(){return {}});
  if(r.status===401){try{localStorage.removeItem('anrem_cloud_token')}catch(e){};return toast('Session expired. Please log in again.')}
  if(!r.ok)throw new Error(x.error||'Unable to save attendance');
  if(x.state)applyCloudState(x.state);
  else {a.push(event);cacheSet('rcs_att',a)}
  toast(action+' saved successfully.');
  render();
 }catch(e){toast(e.message||'Unable to save attendance. Please check your internet connection.')}
}
$('loginForm').onsubmit=function(e){return login(e)};$('eye').onclick=function(){var p=$('staffPass');p.type=p.type==='password'?'text':'password'};$('logout').onclick=logout;restore();
</script></body></html>
